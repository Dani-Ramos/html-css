<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
</head>
<body>
    <main id="conteiner">
        <form id="form_login">
            <div id="form_header">
                <h1>Login</h1>
                <i id="mode_icon" class="fa-solid fa-moon" onclick="mudar()"></i>
            </div>

            <div id="social_media">
                <a href="#">
                    <img src="imagens/facebook.jpg" alt="Facebook">
                </a>
                <a href="#">
                    <img src="imagens/google.png" alt="Google">
                </a>
                <a href="#">
                    <img src="imagens/github.png" alt="Github">
                </a>
            </div>

            <div id="inputs">
                <div class="input_box">
                    <label for="iname">
                        Name
                        <div class="input_field">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" name="name" id="iname">
                        </div>
                    </label>
                </div>

                <div class="input_box">
                    <label for="iemail">
                        Email
                        <div class="input_field">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" name="email" id="iemail">
                        </div>
                    </label>
                </div>
                
                <div class="input_box">
                    <label for="ipass">
                        Password
                        <div class="input_field">
                            <i class="fa-solid fa-key"></i>
                            <input type="password" name="password" id="ipass">
                        </div>
                    </label>

                    <div id="forgot_password">
                        <a href="#">
                            Forgot your password?
                        </a>
                    </div>

                    
                </div>

            </div>

            <button type="submit" id="login_button">
                Login
            </button>
        </form>
    </main>

    <script src="javascript/script.js"></script>
</body>
</html>

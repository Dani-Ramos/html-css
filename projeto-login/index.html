<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!--Aqui vai a imagem-->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem vindo(a) novamente. Faca login para acessar sua conta e poder fazer configuracoes no seu ambiente.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <i class="fas fa-user"></i>
                        <input type="email" name="login" id="ilogin" placeholder="Escreva o seu email" autocomplete="email" maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <i class="fas fa-unlock"></i>
                        <input type="email" name="senha" id="isenha" placeholder="Escreva a sua senha" required autocomplete="current-password" minlength="8">
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Enviar">
                    <a href="#" class="botao">Esqueci a senha <i class="fas fa-envelope"></i></a>
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
